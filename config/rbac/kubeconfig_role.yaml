# Permissions for the IronCore kubeconfig rotation (config.Getter) to persist the
# rotated client certificate / kubeconfig as a Secret in the controller's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: pool-lifecycle-controller
    app.kubernetes.io/managed-by: kustomize
  name: kubeconfig-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
